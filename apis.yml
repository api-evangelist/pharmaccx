name: PharmaCCX
description: 'PharmaCCX, operating as CCX (Contingent Commitment Exchange), is a digital
  market-access and pricing software company for the pharmaceutical industry, serving
  pharma manufacturers, payers, and health systems. Its enterprise platform provides
  a single source of truth for global pricing strategy and contract management through
  three products: CCX Planning (contract scenario planning, modeling, and analysis),
  Deal Admin (contract administration and pharma-payer coordination), and CCX Digital
  Negotiation (an invite-only deal negotiation tool). The platform is delivered as
  an invite-only enterprise SaaS terminal (marketaccess.ccxterminal.com) with Terminal
  and Sandbox environments; no public developer API, documentation, or portal is
  published as of this profiling.'
